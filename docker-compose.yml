name: sentinelai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    build:
      context: infra/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SEED_DIR: /seed
      LIVE_STREAM_SECRET: ${LIVE_STREAM_SECRET:-dev-live-stream-secret}
      WORKER_PUBLIC_URL: ${WORKER_PUBLIC_URL:-http://localhost:8081}
    volumes:
      - ./data/seed:/seed:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    ports:
      - "8081:8081"
    environment:
      API_BASE_URL: http://api:8000
      DEVICE_TOKEN: ${BOOTSTRAP_DEVICE_TOKEN:-}
      PREVIEW_DIR: /preview
      BUFFER_DIR: /var/lib/sentinel
      MODEL_PATH: /models/yolov8n.pt
      MODEL_VERSION: yolov8n.pt
      SEED_DIR: /seed
      SENSOR_WEBHOOK_TOKEN: ${SENSOR_WEBHOOK_TOKEN:-dev-sensor-webhook-token}
      SENSOR_WEBHOOK_PORT: "8081"
      LIVE_STREAM_SECRET: ${LIVE_STREAM_SECRET:-dev-live-stream-secret}
      LIVE_CORS_ORIGIN: ${LIVE_CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./data/videos:/videos:ro
      - ./data/seed:/seed
      - ./data/preview:/preview
      - worker_buffer:/var/lib/sentinel
      - worker_models:/models
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  worker_buffer:
  worker_models:
