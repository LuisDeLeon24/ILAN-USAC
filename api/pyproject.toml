[project]
name = "sentinel-api"
version = "0.1.0"
description = "SentinelAI API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "cryptography>=44",
  "redis>=5.2",
  "minio>=7.2",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
